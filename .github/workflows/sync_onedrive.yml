name: Generate & Sync Reports to OneDrive

on:
  repository_dispatch:
    types: [trigger-sync]
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Report Generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python generate_reports.py

      - name: Upload COM Report to OneDrive
        uses: wei/rclone@v1
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        with:
          args: copy output_reports/COM_Report.xlsx onedrive:/Ecommerce_Reports/

      - name: Upload MKT Report to OneDrive
        uses: wei/rclone@v1
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        with:
          args: copy output_reports/MKT_Report.xlsx onedrive:/Ecommerce_Reports/
